# yaml-language-server: $schema=https://ironflock.com/schemas/data-template/v1.yml
data:
  description: Condition monitoring for presses and lathes on the shop floor.
  tables:
    - tablename: measurements
      description: Periodic process measurements, one row per machine and sample.
      columns:
        - id: tsp
          name: Timestamp
          description: Time of the sample (UTC)
          dataType: timestamp
        - id: machine_id
          name: Machine
          description: Machine identifier, e.g. press-1
          dataType: string
        - id: temperature
          name: Temperature
          description: Spindle temperature in °C
          dataType: numeric
        - id: vibration
          name: Vibration
          description: RMS vibration velocity in mm/s
          dataType: numeric
        - id: power_kw
          name: Power
          description: Electrical power draw in kW
          dataType: numeric
    - tablename: machine_status
      description: Current operating state per machine; append-only, newest row per machine wins.
      maintainLatestFlagFor: [machine_id]
      columns:
        - id: tsp
          name: Timestamp
          description: Time the state was recorded (UTC)
          dataType: timestamp
        - id: machine_id
          name: Machine
          description: Machine identifier, e.g. press-1
          dataType: string
        - id: state
          name: State
          description: Operating state, one of RUNNING, IDLE, FAULT
          dataType: string
        - id: state_text
          name: State in words
          description: The state as the board shows it beside its colour, Running, Idle or Fault
          dataType: string
        - id: target_rpm
          name: Target speed
          description: Target spindle speed in rpm set from the board
          dataType: numeric
    - tablename: machine_documents
      description: Manuals and service reports attached to a machine from the board.
      maintainLatestFlagFor: [machine_id]
      columns:
        - {id: tsp, name: Timestamp, description: Time the document was attached (UTC), dataType: timestamp}
        - {id: machine_id, name: Machine, description: Machine identifier, dataType: string}
        - {id: file_key, name: File key, description: Key of the file in the FleetFiles namespace documents, dataType: string}
        - {id: file_name, name: File name, description: Original name of the uploaded file, dataType: string}
        - {id: size_bytes, name: Size, description: File size in bytes, dataType: bigint}
        - {id: content_type, name: Content type, description: MIME type of the file, dataType: string}
        - {id: pages, name: Pages, description: Number of pages, dataType: numeric}
    - tablename: machine_reports
      description: Problem reports on a machine, made on a phone at the machine.
      maintainLatestFlagFor: [report_id]
      columns:
        - {id: tsp, name: Timestamp, description: Time the report was saved (UTC), dataType: timestamp}
        - {id: report_id, name: Report, description: Report identifier (a UUID the form generates), dataType: string}
        - {id: machine_id, name: Machine, description: Machine identifier, dataType: string}
        - {id: note, name: Note, description: What the reporter saw, dataType: string}
    - tablename: machine_photos
      description: Photos of machine reports, one row per photo.
      maintainLatestFlagFor: [photo_id]
      columns:
        - {id: tsp, name: Timestamp, description: Time the photo row was saved (UTC), dataType: timestamp}
        - {id: photo_id, name: Photo, description: Photo identifier (a UUID the form generates), dataType: string}
        - {id: report_id, name: Report, description: The report the photo belongs to, dataType: string}
        - {id: file_key, name: File key, description: Key of the photo in the FleetFiles namespace photos, dataType: string}
        - {id: file_name, name: File name, description: Original name of the photo, dataType: string}
        - {id: size_bytes, name: Size, description: Size of the stored photo in bytes, dataType: bigint}
        - {id: content_type, name: Content type, description: MIME type of the stored photo, dataType: string}
        - {id: file_url, name: URL, description: Platform URL of the stored photo, dataType: string}
        - {id: captured_at, name: Taken at, description: Time the photo was taken (UTC), dataType: timestamp}
        - {id: latitude, name: Latitude, description: Latitude where the photo was taken in decimal degrees, dataType: numeric}
        - {id: longitude, name: Longitude, description: Longitude where the photo was taken in decimal degrees, dataType: numeric}
        - {id: altitude, name: Altitude, description: Altitude where the photo was taken in metres, dataType: numeric}
        - {id: position_source, name: Position source, description: Where the position came from (exif or device), dataType: string}
  transforms:
    - tablename: daily_energy
      description: Energy per machine and day.
      materialize: true
      schedule: "0 * * * *"
      sql: >-
        SELECT time_bucket('1 day', tsp) AS tsp, machine_id,
        avg(power_kw) * 24 AS energy_kwh FROM measurements GROUP BY 1, 2
      columns:
        - {id: tsp, name: Day, description: Start of the day (UTC), dataType: timestamp}
        - {id: machine_id, name: Machine, description: Machine identifier, dataType: string}
        - {id: energy_kwh, name: Energy, description: Energy used that day in kWh, dataType: numeric}
    - tablename: machine_alarm_links
      description: One link per machine and state, for a menu below the machine pages.
      materialize: false
      schedule: "* * * * *"
      sql: >-
        SELECT DISTINCT ON (machine_id, state) machine_id, state,
        '/machines/' || machine_id || '/alarms/' || state AS route
        FROM machine_status ORDER BY machine_id, state, tsp DESC
      columns:
        - {id: machine_id, name: Machine, description: Machine identifier, dataType: string}
        - {id: state, name: State, description: Operating state, dataType: string}
        - {id: route, name: Route, description: Board route of the machine's alarm page for that state, dataType: string}
files:
  description: Machine manuals, service reports and report photos uploaded from the board.
  namespaces:
    - name: documents
      description: Manuals and service reports, as PDF or image.
      contentTypes: ["application/pdf", "image/png", "image/jpeg"]
      maxObjectBytes: 20971520
    - name: photos
      description: Photos of machine reports, resized to JPEG on the phone.
      contentTypes: ["image/jpeg"]
      maxObjectBytes: 10485760
    - name: reports
      description: Exported reports, as PDF.
      contentTypes: ["application/pdf"]
