# yaml-language-server: $schema=https://ironflock.com/schemas/board-template/v1.yml
# Example board-template.yml for an app with two tables:
#   measurements     tsp, machine_id, temperature, vibration, power_kw
#   machine_status   tsp, machine_id, state, state_text, target_rpm  (maintainLatestFlagFor: [machine_id])
# Viewers: the shift supervisor at a desk or laptop (office preset). The home page
# answers "how are the machines doing?": the machine states (the biggest tile, top
# left) and the temperature gauges on top, the hourly highest temperature and the
# power draw below; /machines/* answers it for one machine. States: RUNNING green,
# IDLE grey, FAULT red, the same on every widget, each with its word beside it.
# Chart series take the office preset's series colours (board-charts.md).
# Three pages: an overview (/), a machine list (/machines) and a detail page per
# machine (/machines/*) filtered by the URL. Shows static and data-driven
# navigation, aggregation, latest-per-entity rows and a fully covered grid.
# Every page is reachable by clicking and leads back: the sidenav's title links
# home. The sidenavs highlight only the most specific matching item (1.0.26 and
# later), so the Machines item stays on while a machine's page is open.
# Both sidenavs have fixedWidth, so they keep their width on every screen size.
name: machine-monitor
widgets:
    - layout_id: nav
      package_name: widget-sidenav
      version: 1.0.27
      chartconfig:
          title: $str:Machine Monitor
          route: $str:/
          navItems:
              - label: $str:Machines
                iconName: $str:precision_manufacturing
                route: $str:/machines
    - layout_id: temperature-gauges
      package_name: widget-gauge
      version: 1.7.45
      chartconfig:
          title: $str:Spindle temperature
          subTitle: $str:°C, latest reading per machine
          dataseries:
              - label: $str:Temperature
                unit: $str:°C
                precision: $num:1
                multiChart: $bool:true
                data:
                    tableRef:
                        tablename: measurements
                        format:
                            tsp: tsp
                            value: temperature
                            pivot: machine_id
                        queryParams:
                            limit: 100
                            windowPeriod: minute
                            windowLength: 5
                            nowMinusPeriods: 0
                sections:
                    gaugeMinValue: $num:0
                    sectionLimits:
                        - limit: $num:70
                          sectionColor: $str:#16a34a
                        - limit: $num:85
                          sectionColor: $str:#d97706
                        - limit: $num:100
                          sectionColor: $str:#dc2626
    - layout_id: power
      package_name: widget-value
      version: 1.1.39
      chartconfig:
          title: $str:Power draw
          subTitle: $str:kW, latest reading per machine
          dataseries:
              - label: $str:Power
                unit: $str:kW
                precision: $num:1
                multiChart: $bool:true
                data:
                    tableRef:
                        tablename: measurements
                        format:
                            tsp: tsp
                            value: power_kw
                            pivot: machine_id
                        queryParams:
                            limit: 100
                            windowPeriod: minute
                            windowLength: 5
                            nowMinusPeriods: 0
    - layout_id: trend
      package_name: widget-linechart
      version: 1.7.15
      chartconfig:
          title: $str:Highest spindle temperature
          subTitle: $str:°C, hourly maximum of all machines, last 24 h
          axis:
              timeseries: $bool:true
              yAxisLabel: $str:Temperature (°C)
          dataseries:
              - label: $str:Temperature
                type: $str:line
                borderColor: $str:#2563eb
                backgroundColor: $str:#2563eb
                data:
                    tableRef:
                        tablename: measurements
                        format:
                            x: tsp
                            y: temperature
                        queryParams:
                            limit: 3000
                            windowPeriod: hour
                            windowLength: 24
                            nowMinusPeriods: 0
                            series:
                                method: MAX
                                bucket:
                                    length: 1
                                    period: hour
    - layout_id: states
      package_name: widget-table
      version: 1.3.1
      chartconfig:
          title: $str:Machine state
          columns:
              - header: $str:Machine
                type: $str:string
                values:
                    tableRef:
                        tablename: machine_status
                        format:
                            value: machine_id
                        queryParams:
                            limit: 50
                            filterAnd:
                                - latest: true
                                  column: ''
                                  operator: '='
                                  value: ''
                                  dataType: boolean
              - header: '$str:'
                type: $str:state
                values:
                    tableRef:
                        tablename: machine_status
                        format:
                            value: state
                        queryParams:
                            limit: 50
                            filterAnd:
                                - latest: true
                                  column: ''
                                  operator: '='
                                  value: ''
                                  dataType: boolean
                styling:
                    stateMap: "$str:'RUNNING', '#16a34a', 'IDLE', '#64748b', 'FAULT', '#dc2626'"
              - header: $str:State
                type: $str:string
                values:
                    tableRef:
                        tablename: machine_status
                        format:
                            value: state_text
                        queryParams:
                            limit: 50
                            filterAnd:
                                - latest: true
                                  column: ''
                                  operator: '='
                                  value: ''
                                  dataType: boolean
              - header: $str:Updated
                type: $str:timestamp
                values:
                    tableRef:
                        tablename: machine_status
                        format:
                            value: tsp
                        queryParams:
                            limit: 50
                            filterAnd:
                                - latest: true
                                  column: ''
                                  operator: '='
                                  value: ''
                                  dataType: boolean
    - layout_id: machine-list
      package_name: widget-sidenav
      version: 1.0.27
      chartconfig:
          title: $str:Machines
          navItems:
              tableRef:
                  tablename: machine_status
                  format:
                      label: machine_id
                      iconName: $str:precision_manufacturing
                      route: $str:/machines/{{machine}}     # absolute, built from the row's key
                      variables:
                          - {label: $str:machine, value: machine_id}
                  queryParams:
                      limit: 50
                      filterAnd:
                          - latest: true
                            column: ''
                            operator: '='
                            value: ''
                            dataType: boolean
    - layout_id: machines-hint
      package_name: widget-markdown
      version: 1.1.0
      chartconfig:
          markdown: |
              ## Machines
              Pick a machine on the left to see its temperature, vibration and power.
    # One figure in its context: a widget-markdown card, the number rounded,
    # sized to the tile, and left out once the reading is older than a minute.
    - layout_id: machine-power
      package_name: widget-markdown
      version: 1.1.0
      chartconfig:
          markdown: |
              <style>
              .kpi {display:flex; flex-wrap:wrap; align-items:baseline; gap:.25em 1em; overflow-wrap:anywhere}
              .kpi .v {font-size:clamp(1.25em,min(15cqw,32cqh),3em); font-weight:700; line-height:1.1}
              .kpi .u, .kpi .c {opacity:.7}
              </style>
              <div class="kpi">
              <div class="c">Power draw</div>
              <div><span class="v">{{power}}</span> <span class="u">kW</span></div>
              <div class="c">measured {{measured}}</div>
              </div>
          data:
              - label: $str:power
                valueType: $str:number
                precision: $num:1
                maxLatency: $num:60
                value:
                    valueRef:
                        tablename: measurements
                        column: power_kw
                        queryParams:
                            limit: 1
                            filterAnd:
                                - {column: machine_id, operator: '=', value: '2', dataType: string, useRoute: true}
                tsp:
                    valueRef:
                        tablename: measurements
                        column: tsp
                        queryParams:
                            limit: 1
                            filterAnd:
                                - {column: machine_id, operator: '=', value: '2', dataType: string, useRoute: true}
              - label: $str:measured
                valueType: $str:timestamp
                value:
                    valueRef:
                        tablename: measurements
                        column: tsp
                        queryParams:
                            limit: 1
                            filterAnd:
                                - {column: machine_id, operator: '=', value: '2', dataType: string, useRoute: true}
    - layout_id: machine-trend
      package_name: widget-linechart
      version: 1.7.15
      chartconfig:
          title: $str:Temperature and vibration
          subTitle: $str:°C and mm/s, last 24 h
          axis:
              timeseries: $bool:true
              showLegend: $bool:true
              yAxisLabel: $str:Temperature (°C)
              yAxisLabelRight: $str:Vibration (mm/s)
          dataseries:
              - label: $str:Temperature
                type: $str:line
                borderColor: $str:#2563eb
                backgroundColor: $str:#2563eb
                data:
                    tableRef:
                        tablename: measurements
                        format:
                            x: tsp
                            y: temperature
                        queryParams:
                            limit: 3000
                            windowPeriod: hour
                            windowLength: 24
                            nowMinusPeriods: 0
                            series:
                                method: AVG
                            filterAnd:
                                - column: machine_id
                                  operator: '='
                                  value: '2'
                                  dataType: string
                                  useRoute: true
              - label: $str:Vibration
                type: $str:line
                yAxis: $str:right
                borderColor: $str:#1e293b
                backgroundColor: $str:#1e293b
                styling:
                    borderDash: $str:dashed
                data:
                    tableRef:
                        tablename: measurements
                        format:
                            x: tsp
                            y: vibration
                        queryParams:
                            limit: 3000
                            windowPeriod: hour
                            windowLength: 24
                            nowMinusPeriods: 0
                            series:
                                method: AVG
                            filterAnd:
                                - column: machine_id
                                  operator: '='
                                  value: '2'
                                  dataType: string
                                  useRoute: true
layout:
    gridLayout:
        - {id: nav, x: 0, y: 0, w: 16, h: 64, fixedWidth: true}
        - {id: states, x: 16, y: 0, w: 44, h: 36}
        - {id: temperature-gauges, x: 60, y: 0, w: 36, h: 36}
        - {id: trend, x: 16, y: 36, w: 56, h: 28}
        - {id: power, x: 72, y: 36, w: 24, h: 28}
    subRoutes:
        machines:
            gridLayout:
                - {id: nav, x: 0, y: 0, w: 16, h: 64, fixedWidth: true}
                - {id: machine-list, x: 16, y: 0, w: 16, h: 64, fixedWidth: true}
                - {id: machines-hint, x: 32, y: 0, w: 64, h: 64}
            subRoutes:
                '*':
                    gridLayout:
                        - {id: nav, x: 0, y: 0, w: 16, h: 64, fixedWidth: true}
                        - {id: machine-list, x: 16, y: 0, w: 16, h: 64, fixedWidth: true}
                        - {id: machine-power, x: 32, y: 0, w: 64, h: 16}
                        - {id: machine-trend, x: 32, y: 16, w: 64, h: 48}
style:                            # the office preset (board-design.md, Pick a look)
    theme: {theme_name: light}
    background_color: '#f1f5f9'
    text_color: '#1e293b'
    tile_background_color: '#ffffff'
    tile_border_color: '#e2e8f0'
    tile_border_radius: 12px
    grid_gap: 8
    columns: 96
    rows: 64
