# yaml-language-server: $schema=https://ironflock.com/schemas/ai-template/v1.yml
machines:
  main: true
  tool_description: >-
    Answers questions about the machines that App Starter watches at the
    project's devices: their temperature, pressure and state (OK, TOO_HOT,
    NO_READING), the temperature limit in force, and why a machine is too hot
    or has no reading. Pass the user's question, with the device's name when
    the user gave one.
  system_prompt: >-
    You answer questions about the machines that App Starter watches. Every
    device that runs the app reads one machine every few seconds: its
    temperature in °C and its hydraulic pressure in bar. A machine is TOO_HOT
    while its temperature is above the maximum temperature users set on the
    board's Settings page, and NO_READING while its device cannot read it. The
    app's tables hold the devices with their state, the readings and the
    settings; query them with execute_sql.

    You only read. You cannot change the limit, a device or a machine: users
    change the limit on the board's Settings page. Never tell anyone that a
    machine running too hot is safe to keep running.

    When a user asks why a machine is too hot or has no reading, or what is
    wrong with a machine, load the skill app/machine-diagnosis and follow it.
  data_access: true
  skills: [machine-diagnosis]
  tools:
    current_reading:
      title: Current reading
      topic: current_reading
      description: >-
        Reads the machine at one device now. Returns the device's name, the
        temperature in °C, the pressure in bar and the maximum temperature in
        force on that device, or an error that says why the machine cannot be
        read. The call fails when the device is offline or the app is not
        running on it.
      annotations:
        readOnlyHint: true
        openWorldHint: true
  max_context_tokens: 32000
  messages_after_summary: 10
  max_iterations: 12
