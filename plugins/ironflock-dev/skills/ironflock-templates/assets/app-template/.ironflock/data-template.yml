# yaml-language-server: $schema=https://ironflock.com/schemas/data-template/v1.yml
data:
  description: >-
    App Starter reads the machine at every device it runs on: its temperature and
    pressure, whether the temperature is within the limit users set on the board,
    and where the device's live view can be opened.
  tables:
    - tablename: devices
      description: >-
        One row per device that runs the app, with its current state and the address
        of its live view. Written by each device about itself, which registers at
        start; the newest row per device is its current state. Users delete a device
        that is gone with the board's delete form, the one row the board writes here.
      maintainLatestFlagFor: [device_id]
      columns:
        - id: tsp
          name: Updated
          description: When the device last changed its state or its live view address.
          dataType: timestamp
        - id: device_id
          name: Device key
          description: >-
            The device's key in IronFlock, written by the device itself (device_key
            cannot be, because the board's delete row has no device).
          dataType: numeric
        - id: device_name
          name: Device
          description: The device's name in IronFlock, written by the device itself.
          dataType: string
        - id: deleted
          name: Deleted
          description: >-
            True once a user deleted the device on the board. The device writes false
            when it registers at start, so a device that comes back reappears.
          dataType: boolean
        - id: state
          name: State
          description: >-
            OK while the temperature is at or below the limit on the board's Settings
            page, TOO_HOT above it, NO_READING while the machine cannot be read.
          dataType: string
        - id: state_text
          name: State in words
          description: >-
            The state as the board shows it beside its colour: OK, Too hot or No
            reading. Written by the device with the state.
          dataType: string
        - id: ui_url
          name: Live view
          description: >-
            The remote-access address of the device's live view (port 8080). Empty
            while the app runs in development, because only production installs get
            remote-access tunnels.
          dataType: string
    - tablename: measurements
      description: >-
        The machine's readings, one row per device and sample. Written by each device
        every SAMPLE_INTERVAL seconds.
      columns:
        - id: tsp
          name: Time
          description: When the machine was read.
          dataType: timestamp
        - id: device_name
          name: Device
          description: The name of the device that read the machine.
          dataType: string
          path: kwargs.DEVICE_NAME
        - id: temperature
          name: Temperature
          description: Machine temperature in °C.
          dataType: numeric
        - id: pressure
          name: Pressure
          description: Hydraulic pressure in bar.
          dataType: numeric
    - tablename: settings
      description: >-
        The limits users set on the board's Settings page. Written by the board's
        settings form; the newest row is in force on every device.
      columns:
        - id: tsp
          name: Saved
          description: When the settings were saved.
          dataType: timestamp
        - id: max_temperature
          name: Maximum temperature
          description: A device whose temperature is above this, in °C, reports TOO_HOT.
          dataType: numeric
